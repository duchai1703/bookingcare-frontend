# ==========================================
# BOOKINGCARE PRODUCTION NGINX GATEWAY — PHASE 13 BLUEPRINT COMPLIANT
# Tệp: nginx.conf
# Vị trí triển khai: /etc/nginx/nginx.conf (bên trong container app-frontend)
# Phiên bản: 2.0-MySQL | Ngày: 2026-05-25
# Nguồn đặc tả: Phase13-MySQL-Blueprint-Part1.md (Phân khu 3) + Part2.md (Phân khu 7, Phần 1)
# ==========================================

# ==========================================
# TẦNG 1: THAM SỐ CẤU HÌNH CORE & WORKER LEVEL KERNEL
# Blueprint: Part2.md — Tham số Worker Level
# worker_rlimit_nofile >= worker_connections * 2 (8192 >= 2048 * 2)
# ==========================================
user nginx;
worker_processes auto;
worker_cpu_affinity auto;
pid /var/run/nginx.pid;
worker_rlimit_nofile 8192;

# ==========================================
# TẦNG 2: KHỐI SỰ KIỆN MẠNG NỘI BỘ (EVENTS CONTEXT)
# Blueprint: Part2.md — worker_connections 2048, multi_accept on
# ==========================================
events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

# ==========================================
# TẦNG 3: KHỐI HTTP GLOBAL CONFIGURATION CONTEXT
# Blueprint: Part2.md — Tham số HTTP Level
# ==========================================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ------------------------------------------
    # Cấu hình định dạng Log chuẩn hóa JSON qua cổng thiết bị stdout/stderr
    # ------------------------------------------
    log_format production_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"cf_connecting_ip":"$http_cf_connecting_ip",'
        '"request":"$request",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /dev/stdout production_json;
    error_log /dev/stderr warn;

    # ------------------------------------------
    # Tối ưu hóa Network Socket Kernel
    # ------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ------------------------------------------
    # Chu kỳ giữ mạch kết nối và chống nghẽn Socket Boundary
    # Blueprint: Part2.md — Upstream Block: keepalive_timeout 65s, keepalive_requests 10000
    # ------------------------------------------
    keepalive_timeout 65s;
    keepalive_requests 10000;

    types_hash_max_size 2048;
    proxy_headers_hash_max_size 512;
    proxy_headers_hash_bucket_size 128;

    # ------------------------------------------
    # Định lượng kích thước giới hạn Body Parser JSON đồng bộ
    # Blueprint: QT-7.1c — client_max_body_size 50M đồng bộ bodyParser.json({ limit: '50mb' })
    # ------------------------------------------
    client_max_body_size 50M;

    # ------------------------------------------
    # Cấu hình Timeouts chống NAT Firewall drop kết nối thô bạo
    # Blueprint: Part2.md — proxy_connect_timeout 75s
    # ------------------------------------------
    proxy_connect_timeout 75s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;

    # ------------------------------------------
    # Chốt chặn phân giải DNS nội bộ Docker Engine
    # Blueprint: Part2.md — resolver 127.0.0.11 ipv6=off valid=30s
    # ------------------------------------------
    resolver 127.0.0.11 ipv6=off valid=30s;

    # ------------------------------------------
    # Lớp chặn Anti-DDoS: limit_req_zone đặt tại cấp HTTP global
    # Blueprint: Part1.md Phân khu 3.2 — CẤM đặt bên trong block location
    # ------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;

    # ------------------------------------------
    # Nhận diện IP thực qua lớp Cloudflare Proxy Shield
    # Blueprint: Part2.md — 14 dải IPv4 + 7 dải IPv6 Cloudflare
    # ------------------------------------------
    real_ip_header CF-Connecting-IP;

    # Cloudflare IPv4 ranges — 14 dải
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # Cloudflare IPv6 ranges — 7 dải
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # ------------------------------------------
    # Nén Static Assets giải phóng băng thông
    # Blueprint: Part2.md — gzip_types, gzip_min_length 256
    # ------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ------------------------------------------
    # Khối cụm node dồn cổng kết nối tái sử dụng Socket Upstream
    # Blueprint: QT-7.1b — server app-backend:8080; keepalive 32;
    # CẤM sử dụng cổng 3000 — giá trị lỗi thời đã bị loại bỏ vĩnh viễn
    # ------------------------------------------
    upstream backend_nodes {
        server app-backend:8080;
        keepalive 32;
    }

    # ==========================================
    # TẦNG 4: VÙNG ĐIỀU PHỐI ĐỊNH TUYẾN (SERVER CONTEXT)
    # ==========================================
    server {
        listen 8080;
        server_name localhost;

        # ------------------------------------------
        # Chốt chặn Header Security gốc
        # ------------------------------------------
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ------------------------------------------
        # TUYẾN 0: Frontend SPA Static Assets (Vite Build Output)
        # Root location phục vụ giao diện người dùng Single Page Application
        # ------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache tài nguyên tĩnh trên trình duyệt
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ------------------------------------------
        # Tuyến phục vụ ảnh upload từ Backend qua volume chia sẻ
        # Blueprint: Part2.md — Volumes: backend_uploads:/usr/share/nginx/uploads:ro
        # ------------------------------------------
        location /uploads/ {
            alias /usr/share/nginx/uploads/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ------------------------------------------
        # TUYẾN THẨM ĐỊNH 1: WebRTC Signaling Handshake
        # Blueprint: Part1.md Phân khu 3.4 — proxy_read_timeout 3600s
        # Blueprint: Part1.md Phân khu 3.2.1 — CẤM ÁP CHỈ THỊ RATE-LIMIT
        # ------------------------------------------
        location /socket.io/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;

            # Khóa bọc cấu trúc nâng cấp giao thức WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Truyền chỉ dấu định danh mạng bảo toàn bảo mật
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Giữ kết nối WebSocket mở dài hạn xuyên suốt 1 giờ tư vấn
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ------------------------------------------
        # TUYẾN THẨM ĐỊNH 2: AI Stream SSE Chatbot Gemini
        # Blueprint: Part1.md Phân khu 3.1 — proxy_buffering off, gzip off, proxy_read_timeout 60s
        # Blueprint: Part1.md Phân khu 3.2.1 — CẤM ÁP CHỈ THỊ RATE-LIMIT
        # ------------------------------------------
        location /api/v1/ai/chat {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;

            # Phóng thích kết nối keepalive không đóng cổng ngắt socket
            proxy_set_header Connection "";

            # Triệt tiêu toàn bộ cơ chế đệm nén: đẩy chunk text thời gian thực lập tức
            proxy_buffering off;
            proxy_cache off;
            gzip off;

            # Tối ưu packet nhỏ Nagle Kernel cho SSE real-time
            tcp_nodelay on;
            tcp_nopush off;

            # Hard timeout khớp aiController dòng 209: setTimeout 60s
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Ép ngắt mạch tiến trình Backend lập tức khi client chủ động hủy kết nối tắt tab
            # Kích hoạt req.on('close') tại aiController dòng 218
            proxy_ignore_client_abort off;

            # Khóa cứng pass-through diskless, triệt tiêu ghi file tạm ăn mòn ổ đĩa host
            proxy_max_temp_file_size 0;
            proxy_set_header X-Accel-Buffering no;
            proxy_set_header Accept-Encoding "";

            # Truyền chỉ dấu định danh mạng
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------
        # TUYẾN THẨM ĐỊNH 3: VNPay IPN Webhook Nhạy Cảm
        # Blueprint: Part1.md Phân khu 3.3 — proxy_buffering off, proxy_read_timeout 15s
        # Quyết toán phản hồi RspCode tức thì cho cổng đối soát tài chính
        # ------------------------------------------
        location = /api/v1/payment/vnpay-ipn {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Phản hồi RspCode tức thì cho cổng đối soát tài chính VNPay
            proxy_buffering off;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;

            # Truyền chỉ dấu định danh mạng
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------
        # TUYẾN THẨM ĐỊNH 4: API Chung Toàn Hệ Thống
        # Blueprint: Part1.md Phân khu 3.2 — proxy_buffering on, limit_req, proxy_next_upstream
        # Blueprint: Part2.md QT-7.1a — proxy_next_upstream error invalid_header (CẤM timeout, http_503)
        # Blueprint: Part2.md — client_body_buffer_size 50M, proxy_request_buffering off
        # ------------------------------------------
        location /api/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;

            # Kích hoạt dồn cổng keepalive
            proxy_set_header Connection "";

            # Áp dụng lớp chặn Anti-DDoS API từ Http Level
            limit_req zone=api_zone burst=20 nodelay;

            # Cấu hình đệm RAM thông thường cho REST API ngắn hạn
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            # Khóa cứng quy tắc chặn rò rỉ đĩa tạm:
            # Ép luân chuyển chuỗi Base64 ảnh LONGBLOB trực tiếp trên RAM
            client_max_body_size 50M;
            client_body_buffer_size 50M;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;

            # Chốt chặn bộ lọc bảo vệ: Loại bỏ cờ tái phát request cho phương thức POST phi định danh
            # QT-7.1a: CẤM timeout và http_503 — ngăn nhân bản giao dịch VNPay và lặp cuộc gọi Gemini API
            proxy_next_upstream error invalid_header;
            proxy_next_upstream_tries 1;
            proxy_next_upstream_timeout 0;

            # Truyền chỉ dấu định danh mạng
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
